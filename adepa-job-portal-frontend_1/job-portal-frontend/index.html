<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NextLeap | Board Your Next Opportunity</title>
    <script>
      // Runs before the stylesheet paints, so an explicit dark/light choice
      // takes effect on the very first frame. Without this, the page would
      // render once under the OS default and jump to the stored choice the
      // moment React mounts and ThemeProvider's effect runs — a flash on every
      // load for anyone whose choice differs from their system setting.
      // Kept in lockstep with ThemeContext.jsx: same key, same three values.
      (function () {
        try {
          var stored = localStorage.getItem('nextleap-theme')
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.dataset.theme = stored
          }
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="icon" type="image/png" href="/images/logo-mark.png" />
    <link rel="apple-touch-icon" href="/images/logo-mark.png" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
